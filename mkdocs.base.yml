site_name: GenMC Documentation

theme:
  name: material
  logo: assets/logo/genmc-mark-dark.svg
  favicon: assets/logo/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: doc/manual

nav:
  - Home: index.md
  - Usage: usage.md
  - Features: features.md
  - CLI Options: cli.md
  - APIs: api.md
  - References: references.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
